spring:
  application:
    name: ticket-reservation-service

  # Database Connection (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:ticket_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate Settings
  jpa:
    hibernate:
      # We use 'validate' because Flyway manages the schema creation
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis Connection
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT}

  # Flyway Database Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Application Server Port
server:
  port: 8080